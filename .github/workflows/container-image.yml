# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: Paperless MCP container image
run-name: "Paperless MCP [monitor:${{ inputs.monitor_id }}:true]"

on:
  workflow_dispatch:
    inputs:
      monitor_id:
        type: string
        default: ""
      monitor_final:
        type: boolean
        default: true
      source_ref:
        description: Source branch or commit to build
        default: release/0.5-descriptions
        required: true
        type: string
      image_tag:
        description: Image tag to publish
        default: ""
        type: string
      push_latest:
        description: Also publish latest
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: paperless-mcp-image
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x

      - name: Run existing tests
        run: dotnet test PaperlessMCP.Tests/PaperlessMCP.Tests.csproj --configuration Release --verbosity minimal

      - name: Resolve image metadata
        id: meta
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          set -euo pipefail
          image="ghcr.io/safrano9999/paperlessmcp"
          tag="${REQUESTED_TAG:-$(date -u +%Y.%-m.%-d)-${GITHUB_RUN_NUMBER}}"
          [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]*$ ]]
          version="$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("PaperlessMCP/PaperlessMCP.csproj").findtext("PropertyGroup/Version"))')"
          {
            echo "version=${version}-docs.${GITHUB_RUN_NUMBER}"
            echo "revision=$(git rev-parse HEAD)"
            echo "tags<<EOF"
            echo "${image}:${tag}"
            if [ "$PUSH_LATEST" = true ]; then echo "${image}:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./PaperlessMCP
          file: .github/scripts/Containerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          labels: |
            io.safrano9999.build.commit=${{ github.sha }}
            io.safrano9999.build.source=efcd593c434cc63628f934423b3951fbf4051aaa
            io.safrano9999.build.inputs=a0c79b988e85f0a6dd9819c95b129169b42fcf6ea14a1bf084b7d590a164adc4
            org.opencontainers.image.source=https://github.com/safrano9999/PaperlessMCP
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
